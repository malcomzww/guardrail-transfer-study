[project]
name = "guardrail-transfer-study"
version = "0.1.0"
description = "Do safety guardrails transfer across language and modality, or do cross-modal safety benchmarks mostly measure whether the model can read the image?"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
